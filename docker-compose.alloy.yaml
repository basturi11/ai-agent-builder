services:
  app:
    image: python:3.11-slim
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      PORT: "5000"
      IS_ALLOY: ${IS_ALLOY:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: bash -lc "pip install --no-cache-dir -r requirements.txt && python app.py"
